[project]
name = "tool-calling-agent"
version = "0.1.0"
description = "Tool-calling support agent with human-approved writes, Postgres-backed tools and a measured task success rate."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
  "respan-ai==4.2.4",
]

[project.optional-dependencies]
# The API image stays lean; only the dashboard image opts into Streamlit.
dashboard = ["streamlit>=1.40"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ""
markers = [
  "integration: requires a live PostgreSQL instance",
  "eval: drives the scenario harness",
  "unit: fast unit tests that require no external dependencies",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["agent", "tests", "evals", "dashboard", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "evals", "dashboard", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
# Scenario prose and the autogenerated migration are data, not layout.
"evals/scenarios.py" = ["E501"]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["agent", "evals", "dashboard", "scripts"]
