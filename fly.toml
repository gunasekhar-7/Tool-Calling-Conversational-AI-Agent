# API deployment. The dashboard ships separately (Fly, Streamlit Community Cloud,
# or any container host) and only needs API_BASE + CUSTOMER_TOKENS.
#
#   fly launch --no-deploy --copy-config --name order-agent-demo
#   fly secrets set DATABASE_URL=... CHECKPOINT_DSN=... CUSTOMER_API_KEYS=... \
#                   OPENAI_API_KEY=... LLM_MODEL=...
#   fly deploy
app = "order-agent-demo"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 50

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
