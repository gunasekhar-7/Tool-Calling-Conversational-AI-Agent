name: Live evaluation

# Manual only: a live run spends money and its numbers depend on a provider.
# Offline CI proves the pipeline; this proves the model.

on:
  workflow_dispatch:
    inputs:
      trials:
        description: "Runs per scenario (2 or more)"
        required: false
        default: "3"

concurrency:
  group: eval-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pm_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/pm_eval
      ENVIRONMENT: eval
      CUSTOMER_API_KEYS: '{"eval-key-a":"11111111-1111-4111-8111-111111111111","eval-key-b":"22222222-2222-4222-8222-222222222222"}'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Fail closed: a missing secret must stop the job, not produce an empty run
      # that someone later reads as "0% task success".
      - name: Require provider credentials
        run: |
          if [ -z "${OPENAI_API_KEY}" ] || [ -z "${LLM_MODEL}" ]; then
            echo "::error::Set OPENAI_API_KEY and LLM_MODEL as repository secrets before dispatching this workflow."
            exit 1
          fi

      - name: Live scenarios
        run: |
          python scripts/evaluate.py --mode live \
            --trials "${{ github.event.inputs.trials }}" --fail-under 0.80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-report
          path: evals/report/
