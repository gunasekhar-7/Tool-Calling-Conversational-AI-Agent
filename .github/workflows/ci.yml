name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CUSTOMER_API_KEYS: '{"ci-key-a":"11111111-1111-4111-8111-111111111111","ci-key-b":"22222222-2222-4222-8222-222222222222"}'

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/pm_test
      CHECKPOINT_DSN: postgresql://postgres:postgres@127.0.0.1:5432/pm_test
      ENVIRONMENT: test
      # The harness defaults to the compose port; the service above listens on 5432.
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (frozen)
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format
        run: uv run --frozen ruff format --check agent tests evals dashboard scripts
      - name: Types
        run: uv run --frozen mypy
      - name: Migrate
        run: uv run --frozen alembic upgrade head
      - name: Tests
        run: uv run --frozen pytest

  eval:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pm_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/pm_eval
      ENVIRONMENT: eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (frozen)
        run: uv sync --frozen --extra dev
      - name: Graded scenarios (scripted replay)
        run: |
          uv run --frozen python scripts/evaluate.py --trials 3 --fail-under 1.0 \
            --database-url "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/pm_eval"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/report/

  images:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t order-agent-api:ci .
      - name: Build dashboard image
        run: docker build -f dashboard/Dockerfile -t order-agent-dashboard:ci .
